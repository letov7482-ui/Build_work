name: Patch CF 1.4 APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to Counterflame 1.4 APK'
        required: true

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip zipalign apksigner default-jdk python3
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool -O apktool_bin
          chmod +x apktool_bin

      - name: Download NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download original APK
        run: wget -q "${{ github.event.inputs.apk_url }}" -O original.apk

      - name: Decompile APK
        run: java -jar apktool.jar d original.apk -o cf_dec -f

      - name: Build native library
        run: |
          cd jni
          $NDK/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)
          mkdir -p ../cf_dec/lib/arm64-v8a
          cp libs/arm64-v8a/libcfpatch.so ../cf_dec/lib/arm64-v8a/

      - name: Patch manifest
        run: python3 tools/patch_manifest.py cf_dec/AndroidManifest.xml

      - name: Inject smali
        run: python3 tools/inject_smali.py cf_dec/

      - name: Copy smali class
        run: |
          mkdir -p cf_dec/smali/com/cf/patch
          cp smali/CFLoader.smali cf_dec/smali/com/cf/patch/CFLoader.smali

      - name: Generate keystore
        run: bash tools/gen_keystore.sh

      - name: Recompile
        run: java -jar apktool.jar b cf_dec -o unsigned.apk

      - name: Zipalign
        run: zipalign -p -f 4 unsigned.apk aligned.apk

      - name: Sign
        run: |
          apksigner sign \
            --ks tools/cf.jks \
            --ks-pass pass:Cf2024! \
            --out cf_patched.apk \
            aligned.apk

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: cf-patched
          path: cf_patched.apk
